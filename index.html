<style>
:root{--brand:#48c9b0;--brand-d:#2fa58d;--bg1:#e9f8f4;--bg2:#fdf6f0;--text:#1c2b28;--mut:#6b7f7a;--glass:rgba(255,255,255,.66);--bd:rgba(255,255,255,.85);--inp:rgba(255,255,255,.9);--sh:0 8px 28px rgba(47,165,141,.13);--sheet:#fbfefd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0e1f1c;--bg2:#15171f;--text:#e8f3f0;--mut:#8fa6a0;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--inp:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.3);--sheet:#13201d}}
:root[data-theme="dark"]{--bg1:#0e1f1c;--bg2:#15171f;--text:#e8f3f0;--mut:#8fa6a0;--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--inp:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.3);--sheet:#13201d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin:0}h1 span{color:var(--brand-d)}
.sub{color:var(--mut);font-size:.8rem}
.logo{width:56px;height:56px;object-fit:contain;flex:none}
h2{font-family:'Playfair Display',serif;font-size:1.1rem;margin:0 0 10px}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:20px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--sh)}
.ic{border:1px solid var(--bd);background:var(--glass);border-radius:14px;padding:9px 13px;cursor:pointer;color:var(--text);font:500 .85rem Inter;position:relative}
.badge{position:absolute;top:-6px;right:-6px;background:var(--brand);color:#fff;border-radius:99px;font-size:.68rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs button,.chips button{flex:none;border:1px solid var(--bd);background:var(--glass);color:var(--text);padding:9px 18px;border-radius:99px;font:500 .88rem Inter;cursor:pointer}
.chips button{padding:6px 14px;font-size:.8rem}
.tabs button.on,.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:6px}
.p{padding:0;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:4/5;background:linear-gradient(135deg,rgba(72,201,176,.25),rgba(253,246,240,.6));display:grid;place-items:center;font-size:2.4rem;position:relative}
.im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tag{position:absolute;left:8px;top:8px;background:var(--glass);backdrop-filter:blur(8px);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:600;z-index:1}
.pb{padding:11px;display:flex;flex-direction:column;gap:3px;flex:1}
.pn{font-size:.88rem;font-weight:500}.pp{font-weight:600;color:var(--brand-d)}
.btn{border:0;border-radius:12px;background:var(--brand);color:#fff;font:600 .85rem Inter;padding:10px;cursor:pointer;margin-top:auto;width:100%}
.btn:hover{background:var(--brand-d)}.btn.g{background:var(--inp);color:var(--text);border:1px solid var(--bd)}.btn:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:50px 10px;font-size:.92rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:9;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:none;font-size:1.4rem;color:var(--mut);cursor:pointer}
label{display:block;font-size:.75rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--inp);color:var(--text);font:400 .92rem Inter;outline:none}
input:focus,select:focus{border-color:var(--brand)}
.seg{display:flex;background:var(--inp);border-radius:12px;padding:4px;margin:6px 0}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:9px;font:500 .84rem Inter;color:var(--mut);cursor:pointer}.seg button.on{background:var(--brand);color:#fff}
.ci{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.ci .t{width:46px;height:46px;border-radius:10px;background:rgba(72,201,176,.2);overflow:hidden;display:grid;place-items:center;flex:none}.ci .t img{width:100%;height:100%;object-fit:cover}
.ci div.m{flex:1;font-size:.88rem}.ci small{color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-size:.92rem;padding:4px 0}.tot.b{font-weight:600;font-size:1.05rem}
.note{font-size:.76rem;color:var(--mut);margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imp{margin-top:22px;padding:20px 18px}.imp h2{font-size:1.25rem;margin:0 0 4px}.imp p{margin:0 0 14px;color:var(--mut);font-size:.84rem}
.ist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ist div{background:var(--inp);border:1px solid var(--bd);border-radius:16px;padding:12px}.ist b{display:block;font:600 1.25rem 'Playfair Display',serif;color:var(--brand-d);margin:2px 0}.ist small{color:var(--mut);font-size:.74rem}
.ist span{font-size:1.3rem}
.sl{display:flex;justify-content:space-between;font-size:.88rem;font-weight:500}.sl b{color:var(--brand-d)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--brand);margin:12px 0}
.res{background:var(--inp);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}.res div{display:flex;justify-content:space-between;font-size:.88rem;padding:4px 0}.res b{color:var(--brand-d)}
.cimp{margin-top:10px;font-size:.8rem;color:var(--brand-d);background:rgba(72,201,176,.14);border-radius:12px;padding:8px 12px}
.loc{margin-top:16px;padding:18px}.loc h2{font-size:1.1rem;margin:0 0 8px}.loc p{margin:4px 0;font-size:.9rem}.loc a{display:inline-block;margin-top:10px;color:var(--brand-d);font-weight:600;font-size:.88rem;text-decoration:none}

.soc{margin-top:18px;text-align:center}.soc .fol{margin:0 0 12px;color:var(--mut);font-size:1rem}.soc .fol b{color:var(--mut);font-weight:700}.pl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:10px}.soc a{margin:0;padding:14px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--glass);box-shadow:var(--sh);color:var(--text);font-weight:500;font-size:.9rem}
.vis{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 4px;color:var(--mut);font-size:.9rem}.vis svg{width:44px;height:44px;flex:none}.vis b{font:600 1.3rem 'Playfair Display',serif;color:var(--brand-d)}
.logo{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--sheet);padding:11px 18px;border-radius:99px;font-size:.85rem;z-index:20;max-width:90%;text-align:center;box-shadow:var(--sh)}
</style>
